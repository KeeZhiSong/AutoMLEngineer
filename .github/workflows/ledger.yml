name: Rebuild the search ledger

# docs/index.html is DERIVED from the run logs. Regenerating it on every push
# means the published page cannot disagree with the repository -- the same
# "verify by measurement, not by assertion" rule the rest of the project uses.

on:
  push:
    branches: [main]
    paths:
      - 'workspace*/**'
      - 'archive/runs/**'
      - 'tools_build_ledger.py'
      - '.github/workflows/ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependencies: the generator reads JSONL with the standard library.
      - name: Rebuild docs/index.html
        run: python3 tools_build_ledger.py

      - name: Commit if the page changed
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "page already matches the logs, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Rebuild the search ledger from the run logs"
          git push
